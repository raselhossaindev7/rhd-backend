<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RHD API</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2348426D'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='13' font-weight='bold' fill='white' text-anchor='middle'%3ERH%3C/text%3E%3C/svg%3E" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", -apple-system, sans-serif;
      background: #09090b;
      color: #fafafa;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .box { text-align: center; padding: 24px; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 999px;
      border: 1px solid #27272a; background: #101013;
      font-size: 14px; color: #a1a1aa;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #71717a; }
    .dot.ok { background: #34D399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.7); }
    .dot.down { background: #f87171; box-shadow: 0 0 10px rgba(248, 113, 113, 0.7); }
    h1 { margin-top: 20px; font-size: clamp(24px, 4vw, 32px); font-weight: 600; letter-spacing: -0.02em; }
  </style>
</head>
<body>
  <div class="box">
    <span class="status">
      <span class="dot" id="dot"></span>
      <span id="state">Checking…</span>
    </span>
    <h1>API is working</h1>
  </div>

  <script>
    async function check() {
      const dot = document.getElementById("dot");
      const state = document.getElementById("state");
      try {
        const res = await fetch("/api/health", { cache: "no-store" });
        if (!res.ok) throw new Error();
        dot.className = "dot ok";
        state.textContent = "Online";
      } catch {
        dot.className = "dot down";
        state.textContent = "Offline";
      }
    }
    check();
    setInterval(check, 30000);
  </script>
</body>
</html>
