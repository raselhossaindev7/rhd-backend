services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: rhd-backend:latest
    container_name: rhd-api

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}

    networks:
      - rhd-network

  nginx:
    image: nginx:alpine
    container_name: rhd-nginx

    restart: unless-stopped

    ports:
      - "8080:80"
      - "9443:443"

    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot

    depends_on:
      - backend

    networks:
      - rhd-network

  certbot:
    image: certbot/certbot
    container_name: rhd-certbot

    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot

    networks:
      - rhd-network

networks:
  rhd-network:

volumes:
  certbot-data:
  certbot-www: