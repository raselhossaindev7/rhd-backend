services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: rhd-backend:latest
    container_name: rhd-api

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}

    networks:
      - rhd-network
      - abs_app-network

networks:
  rhd-network:
  abs_app-network:
    external: true