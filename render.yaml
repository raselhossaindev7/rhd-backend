services:
  - type: web
    name: rhd-backend
    runtime: node
    buildCommand: npx prisma migrate deploy && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Runtime pooled URL (transaction mode, 6543) — set in dashboard.
      - key: DATABASE_URL
        sync: false
      # Migrations only (session-mode pooler, 5432) — set in dashboard.
      # `migrate deploy` uses DIRECT_URL (see prisma/schema.prisma).
      - key: DIRECT_URL
        sync: false